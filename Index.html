<!DOCTYPE html>
<html>
<head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f2f2f2;
}
table {
  border-collapse: collapse;
  width: 70%;
  background: white;
  border: 3px solid #2c3e50;
  border-radius: 10px;
  overflow: hidden;
}
th {
  background: #2c3e50;
  color: white;
  padding: 12px;
}
td {
  padding: 10px;
  text-align: center;
  border: 1px solid #ddd;
}
tr:nth-child(even) {
  background: #f9f9f9;
}
tr:hover {
  background: #eef3ff;
}
</style>
</head>
<body>

<table>
  <tr>
    <th>Name</th>
    <th>Course</th>
    <th>Year</th>
  </tr>
  <tr>
    <td>Belinda</td>
    <td>Computer Science</td>
    <td>2</td>
  </tr>
  <tr>
    <td>Stacy</td>
    <td>ICT</td>
    <td>3</td>
  </tr>
  <tr>
    <td>Christabel</td>
    <td>IT</td>
    <td>2</td>
  </tr>
</table>

</body>
</html>
